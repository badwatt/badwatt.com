services:
  badwatt:
    container_name: badwatt
    image: ghcr.io/pnpm/pnpm:latest
    restart: unless-stopped
    command: >
      sh -c
      "
      pnpm runtime set node latest -g
      && cd /project
      && pnpm install
      && pnpm run build
      && exec node dist/server/entry.mjs
      "
    volumes:
      - .:/project
    networks: [proxy]
    labels:
      traefik.enable: true
      traefik.http.routers.badwatt.entrypoints: https
      traefik.http.routers.badwatt.rule: Host(`badwatt.com`) || Host(`azama.es`)
      traefik.http.routers.badwatt.service: badwatt
      traefik.http.services.badwatt.loadbalancer.server.port: 4321

networks:
  proxy:
    external: {}
