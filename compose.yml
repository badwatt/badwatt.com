services:
  badwatt:
    container_name: badwatt
    image: ghcr.io/voidzero-dev/vite-plus:latest
    restart: unless-stopped
    working_dir: /project
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        vp install --frozen-lockfile &&
        vp run build &&
        exec node dist/server/entry.mjs
    volumes:
      - .:/project
